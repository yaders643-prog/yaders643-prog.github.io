    /* PANTALLA DE BIENVENIDA */

#pantalla-inicio {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #fce4ec, #e1bee7);
    z-index: 3000;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: opacity 1s ease, visibility 1s ease;
}

.inicio-contenido {
    padding: 25px;
    animation: aparecerInicio 2s ease;
}

.corazon-inicio {
    font-size: 65px;
    animation: latido 1.5s infinite;
}

.inicio-contenido h1 {
    color: #7b1fa2;
    font-family: Georgia, serif;
    font-size: 2rem;
}

.inicio-contenido p {

.tocar-inicio {
    margin-top: 35px;
    padding: 13px 20px;
    border: 2px solid #ba68c8;
    border-radius: 12px;
    color: #7b1fa2;
    font-weight: bold;
    animation: brillo 2s infinite;
}

.decoracion-inicio {
    margin-top: 25px;
    font-size: 25px;
}

@keyframes latido {
    50% {
        transform: scale(1.2);
    }
}

@keyframes brillo {
    50% {
        opacity: 0.5;
    }
}

@keyframes aparecerInicio {
    from {
        opacity: 0;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

#pantalla-inicio.ocultar {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
    
/* CORAZONES QUE APARECEN AL TOCAR LA PANTALLA */
.corazon-flotante {
    position: fixed;
    z-index: 5000;
    pointer-events: none;
    font-size: 8px;
    left: 0;
    top: 0;
    opacity: 1;
    animation: dispersarCorazon 0.5s ease-out forwards;
}

@keyframes dispersarCorazon {
    0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.5) rotate(0deg);
    }

    50% {
        opacity: 1;
        transform: translate(
            var(--dx),
            var(--dy)
        ) scale(1.4) rotate(var(--rot));
    }

    100% {
        opacity: 0;
        transform: translate(
            calc(var(--dx) * 1.5),
            calc(var(--dy) * 1.5)
        ) scale(0.5) rotate(var(--rot));
    }
}

  <script>

  
const frases = {
    t1: `🌷

Me gustas más de lo que imaginas. Hay algo en ti que hace que mis días sean más bonitos y que mi sonrisa tenga un motivo especial. 💗✨`,

    imagen: `Eres mi bonita casualidad. ❤️`,

    t2: `💭

❤️Aquí me quedo… con el corazón abierto, el alma tranquila y el amor puesto en ti, sin fecha de vencimiento ♾️🐢`
};

const lapiz=document.getElementById("lapiz");
const VELOCIDAD=160;

function escribir(id,texto,cb){
let i=0;
const el=document.getElementById(id);
lapiz.style.display="block";
const int=setInterval(()=>{
if(i<texto.length){
const s=document.createElement("span");
s.textContent=texto.charAt(i);
el.appendChild(s);
const r=s.getBoundingClientRect();
lapiz.style.left=r.left+"px";
lapiz.style.top=(r.top-55)+"px";
i++;
}else{
clearInterval(int);
lapiz.style.display="none";
if(cb)cb();
}
},VELOCIDAD);
}

let experienciaIniciada = false;

function iniciarExperiencia() {

    if (experienciaIniciada) return;

    experienciaIniciada = true;

    const pantalla = document.getElementById("pantalla-inicio");
    const musica = document.getElementById("musica");

    pantalla.classList.add("ocultar");

    musica.volume = 0.6;

    musica.play().catch(error => {
        console.log("No se pudo iniciar la música:", error);
    });

    setTimeout(() => {

        escribir("text1", frases.t1, () => {

            const imagen = document.getElementById("imagen-texto1");

            imagen.classList.add("mostrar");

            setTimeout(() => {

                escribir("texto-imagen", frases.imagen, () => {

                    setTimeout(() => {

                        escribir("text2", frases.t2, () => {
                            document.getElementById("pregunta").style.opacity = 1;
                        });

                    }, 1000);

                });

            }, 1200);

        });

    }, 800);
}

function playMusica(){
const m=document.getElementById("musica");
if(m.paused) m.play();
}

function moverBoton(){

    const b = document.getElementById("btn-no");
    const c = document.querySelector(".question-box");

    const margen = 10;

    const maxX = c.clientWidth - b.offsetWidth - margen;
    const maxY = c.clientHeight - b.offsetHeight - margen;

    const x = margen + Math.random() * Math.max(0, maxX - margen);
    const y = margen + Math.random() * Math.max(0, maxY - margen);

    b.style.left = x + "px";
    b.style.top = y + "px";
    b.style.right = "auto";
    b.style.transform = "none";
}

function mostrarFinal(){
document.getElementById("mensaje-final").style.display="block";
}
  
  const btnFullscreen = document.getElementById("btnFullscreen");

btnFullscreen.addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            btnFullscreen.textContent = "⛶";
        } else {
            await document.exitFullscreen();
            btnFullscreen.textContent = "⛶";
        }
    } catch (error) {
        console.log("No se pudo activar pantalla completa:", error);
    }
});

document.addEventListener("fullscreenchange", () => {
    btnFullscreen.textContent = "⛶";
});
    
    
/* CORAZONES AL PRESIONAR LA PANTALLA */

document.addEventListener("click", function(e) {

    const cantidad = 9;

    for (let i = 0; i < cantidad; i++) {

        const corazon = document.createElement("div");

        corazon.className = "corazon-flotante";

        const corazones = ["💗", "💖", "💕", "❤️", "🌹", "💘"];

        corazon.textContent =
            corazones[Math.floor(Math.random() * corazones.length)];

        corazon.style.left = e.clientX + "px";
        corazon.style.top = e.clientY + "px";

        const angulo = Math.random() * Math.PI * 2;
        const distancia = 50 + Math.random() * 110;

        const dx = Math.cos(angulo) * distancia;
        const dy = Math.sin(angulo) * distancia;

        corazon.style.setProperty("--dx", dx + "px");
        corazon.style.setProperty("--dy", dy + "px");
        corazon.style.setProperty(
            "--rot",
            (Math.random() * 90 - 45) + "deg"
        );

        corazon.style.fontSize =
            (18 + Math.random() * 18) + "px";

        document.body.appendChild(corazon);

        setTimeout(() => {
            corazon.remove();
        }, 1600);
    }

});

</script>
