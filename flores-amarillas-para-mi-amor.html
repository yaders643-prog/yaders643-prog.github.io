function createStarfield() {
  const count = isPremium ? 14000 : 7000;
  const positions = [], colors = [], sizes = [];
  for (let i = 0; i < count; i++) {
    const r = THREE.MathUtils.randFloat(60, 180);
    const phi = Math.acos(THREE.MathUtils.randFloatSpread(2));
    const theta = THREE.MathUtils.randFloat(0, Math.PI * 2);
    positions.push(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
    const cc = Math.random();
    if (cc < 0.55) colors.push(1, 0.84, 0.0);
    else if (cc < 0.8) colors.push(1, 0.92, 0.4);
    else if (cc < 0.95) colors.push(1, 1, 1);
    else colors.push(1, 0.7, 0.1);
    sizes.push(THREE.MathUtils.randFloat(0.15, 0.42));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geo.setAttribute("size", new THREE.Float32BufferAttribute(sizes, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: "attribute float size; attribute vec3 color; varying vec3 vColor; uniform float uTime; void main(){ vColor=color; vec4 mv=modelViewMatrix*vec4(position,1.0); float tw=sin(uTime*2.0+position.x*100.0)*0.4+0.8; gl_PointSize=size*tw*(320.0/-mv.z); gl_Position=projectionMatrix*mv; }",
    fragmentShader: "varying vec3 vColor; void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c); if(d>0.5) discard; float core=1.0-smoothstep(0.0,0.18,d); float alpha=1.0-smoothstep(0.0,0.5,d); vec3 col=vColor*(1.0+core*0.9); gl_FragColor=vec4(col,alpha*0.9); }",
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  return new THREE.Points(geo, mat);
}
const starField = createStarfield();
scene.add(starField);

), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);\n  m = m*m;\n  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));\n}\nfloat getPulseIntensity(vec3 wp, vec3 pp, float pt){\n  if(pt < 0.0) return 0.0;\n  float tsc = uTime - pt;\n  if(tsc < 0.0 || tsc > uPulseDuration) return 0.0;\n  float pr = tsc * uPulseSpeed;\n  float dc = distance(wp, pp);\n  return smoothstep(3.0, 0.0, abs(dc - pr)) * smoothstep(uPulseDuration, 0.0, tsc);\n}\nvoid main(){\n  float t = position.x;\n  vPathPosition = t;\n  vec3 mid = mix(startPoint, endPoint, 0.5);\n  vec3 perp = normalize(cross(normalize(endPoint - startPoint), vec3(0.0, 1.0, 0.0)));\n  if(length(perp) < 0.1) perp = vec3(1.0, 0.0, 0.0);\n  mid += perp * sin(t * 3.14159) * 0.15;\n  vec3 p0 = mix(startPoint, mid, t);\n  vec3 p1 = mix(mid, endPoint, t);\n  vec3 finalPos = mix(p0, p1, t);\n  finalPos += perp * snoise(vec3(pathIndex*0.08, t*0.6, uTime*0.15)) * 0.12;\n  vec3 wp = (modelMatrix * vec4(finalPos, 1.0)).xyz;\n  float tp = 0.0;\n  for(int i=0;i<3;i++) tp += getPulseIntensity(wp, uPulsePositions[i], uPulseTimes[i]);\n  vPulseIntensity = min(tp, 1.0);\n  vColor = connectionColor;\n  vConnectionStrength = connectionStrength;\n  vMorph = uMorph;\n  vDistanceFromCamera = length(wp - cameraPosition);\n  gl_Position = projectionMatrix * modelViewMatrix * vec4(finalPos, 1.0);\n}";
const CONN_FS = "uniform float uTime;\nuniform vec3 uPulseColors[3];\nvarying vec3 vColor;\nvarying float vConnectionStrength, vPulseIntensity, vPathPosition, vDistanceFromCamera, vMorph;\nvoid main(){\n  float f1 = sin(vPathPosition*25.0 - uTime*4.0)*0.5 + 0.5;\n  float f2 = sin(vPathPosition*15.0 - uTime*2.5 + 1.57)*0.5 + 0.5;\n  float flow = (f1 + f2*0.5) / 1.5;\n  vec3 base = vColor * (0.9 + 0.2*sin(uTime*0.6 + vPathPosition*12.0));\n  float flowInt = 0.5 * flow * vConnectionStrength;\n  vec3 finalColor = base;\n  if(vPulseIntensity > 0.0){\n    vec3 pc = mix(vec3(1.0), uPulseColors[0], 0.25);\n    finalColor = mix(base, pc*1.3, vPulseIntensity*0.7);\n    flowInt += vPulseIntensity*0.9;\n  }\n  finalColor *= (1.0 + flowInt + vConnectionStrength*0.55);\n  float alpha = 0.75 * vConnectionStrength + flow*0.3;\n  alpha = mix(alpha, min(1.0, alpha*2.5), vPulseIntensity);\n  alpha *= (1.0 - vMorph*0.99);\n  float fade = smoothstep(100.0, 15.0, vDistanceFromCamera);\n  gl_FragColor = vec4(finalColor, alpha * fade);\n}";
const FILLER_VS = "uniform float uTime, uMorph;\nattribute vec3 targetPosition, aColor, aRand;\nattribute float aActive;\nvarying vec3 vColor;\nvarying float vMorph, vAlpha;\nvoid main(){\n  vec3 finalPos = mix(position, targetPosition, uMorph);\n  float noise = sin(uTime*0.9 + aRand.x*6.283) * 0.15 * (1.0 - uMorph);\n  finalPos += vec3(noise, noise*0.7, noise*0.5);\n  vColor = aColor;\n  vMorph = uMorph;\n  float activeMod = mix(1.0, aActive, uMorph);\n  vAlpha = (0.15 + uMorph*0.85) * activeMod;\n  vec4 mv = modelViewMatrix * vec4(finalPos, 1.0);\n  gl_Position = projectionMatrix * mv;\n  float sizeFactor = mix(250.0, 210.0, uMorph);\n  gl_PointSize = clamp((1.15 + aRand.y*0.55) * (sizeFactor / -mv.z), 1.0, 4.5);\n}";
const FILLER_FS = "varying vec3 vColor;\nvarying float vMorph, vAlpha;\nvoid main(){\n  vec2 uv = gl_PointCoord - vec2(0.5);\n  float d = length(uv);\n  if(d > 0.5) discard;\n  float alphaN = smoothstep(0.5, 0.15, d);\n  float coreN = smoothstep(0.18, 0.0, d);\n  vec3 colorN = vColor * 0.9 + vec3(1.0, 0.9, 0.4) * coreN * 0.25;\n  float alphaP = (d < 0.62) ? 1.0 : 0.0;\n  vec3 colorP = vColor * 1.35 + vec3(0.1, 0.08, 0.0);\n  float alpha = mix(alphaN, alphaP, vMorph);\n  vec3 finalColor = mix(colorN, colorP, vMorph);\n  gl_FragColor = vec4(finalColor, alpha * vAlpha);\n}";
const SPARKLE_VS = "uniform float uTime, uMorph;\nattribute vec3 aColor, aRand, aPos;\nattribute float aSize;\nvarying vec3 vColor;\nvarying float vAlpha, vGlow;\nvoid main(){\n  vec3 finalPos = aPos;\n  finalPos += vec3(\n    sin(uTime*0.4 + aRand.x*6.283)*0.6,\n    cos(uTime*0.5 + aRand.y*6.283)*0.6,\n    sin(uTime*0.3 + aRand.z*6.283)*0.4\n  ) * uMorph;\n  vColor = aColor;\n  float tw = sin(uTime*(2.0 + aRand.x*4.0) + aRand.y*6.283)*0.5 + 0.5;\n  tw = pow(tw, 1.8);\n  vGlow = tw;\n  vAlpha = tw * uMorph;\n  vec4 mv = modelViewMatrix * vec4(finalPos, 1.0);\n  gl_Position = projectionMatrix * mv;\n  float sizeFactor = mix(300.0, 170.0, uMorph);\n  gl_PointSize = clamp(aSize * (1.0 + tw*2.2) * uMorph * (sizeFactor / -mv.z), 1.0, 4.2);\n}";
const SPARKLE_FS = "varying vec3 vColor;\nvarying float vAlpha, vGlow;\nvoid main(){\n  vec2 uv = gl_PointCoord - vec2(0.5);\n  float d = length(uv);\n  if(d > 0.5) discard;\n  float core = 1.0 - smoothstep(0.0, 0.22, d);\n  float halo = 1.0 - smoothstep(0.0, 0.5, d);\n  float alpha = (core*1.5 + halo*0.55) * vAlpha;\n  vec3 finalColor = vColor * (1.2 + vGlow*1.6) + vec3(1.0, 0.9, 0.5)*core*0.25;\n  gl_FragColor = vec4(finalColor, alpha);\n}";

function makeSunflowerTexture() {
  const size = 128;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const cx = size/2, cy = size/2;
  g.fillStyle = "#FFC107";
  for(let i=0;i<16;i++){ g.save(); g.translate(cx,cy); g.rotate(i*Math.PI*2/16); g.beginPath(); g.ellipse(0,-38,9,18,0,0,Math.PI*2); g.fill(); g.restore(); }
  g.fillStyle = "#FFEB3B";
  for(let i=0;i<16;i++){ g.save(); g.translate(cx,cy); g.rotate(i*Math.PI*2/16+Math.PI/16); g.beginPath(); g.ellipse(0,-30,7,14,0,0,Math.PI*2); g.fill(); g.restore(); }
  const grd = g.createRadialGradient(cx,cy,2,cx,cy,22);
  grd.addColorStop(0,"#4a2800"); grd.addColorStop(1,"#1a0e00");
  g.fillStyle = grd; g.beginPath(); g.arc(cx,cy,22,0,Math.PI*2); g.fill();
  g.fillStyle = "#8B5A2B";
  for(let i=0;i<20;i++){ g.beginPath(); const a=Math.random()*Math.PI*2; const r=Math.random()*16; g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,1.3,0,Math.PI*2); g.fill(); }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeSunflowers() {
  const tex = makeSunflowerTexture();
  const count = isPremium ? 60 : 30;
  const group = new THREE.Group();
  for (let i=0;i<count;i++){
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.85 });

    s.scale.set(scale, scale, 1);

  }
  scene.add(group);
  return group;
}
const sunflowerGroup = makeSunflowers();

class Node {
  constructor(pos, level=0, type=0){
    this.position = pos; this.connections = []; this.level = level; this.type = type;
    this.size = type===0 ? THREE.MathUtils.randFloat(0.8,1.4) : THREE.MathUtils.randFloat(0.5,1.0);
    this.distanceFromRoot = 0;
  }
  addConnection(n, s=1.0){
    if(!this.isConnectedTo(n)){ this.connections.push({node:n, strength:s}); n.connections.push({node:this, strength:s}); }
  }
  isConnectedTo(n){ return this.connections.some(c => c.node === n); }
}
function generateNetwork(f=1.0){
  const nodes = [];
  const root = new Node(new THREE.Vector3(0,0,0), 0, 0);
  root.size = 2.2; nodes.push(root);
  const layers = 5;
  const GR = (1+Math.sqrt(5))/2;
  for(let L=1; L<=layers; L++){
    const radius = L*4;
    const N = Math.floor(L*12*f);
    for(let i=0;i<N;i++){
      const phi = Math.acos(1 - 2*(i+0.5)/N);
      const theta = 2*Math.PI*i/GR;
      const pos = new THREE.Vector3(radius*Math.sin(phi)*Math.cos(theta), radius*Math.sin(phi)*Math.sin(theta), radius*Math.cos(phi));
      const isLeaf = L===layers || Math.random()<0.3;
      const n = new Node(pos, L, isLeaf?1:0);
      n.distanceFromRoot = radius;
      nodes.push(n);
      if(L > 1){
        const prev = nodes.filter(x => x.level===L-1 && x!==root);
        prev.sort((a,b)=> pos.distanceTo(a.position)-pos.distanceTo(b.position));
        for(let j=0;j<Math.min(3, prev.length);j++){
          const d = pos.distanceTo(prev[j].position);
          n.addConnection(prev[j], Math.max(0.3, 1 - d/(radius*2)));
        }
      } else { root.addConnection(n, 0.9); }
    }
    const lNodes = nodes.filter(x => x.level===L && x!==root);
    for(const n of lNodes){
      const near = lNodes.filter(x => x!==n).sort((a,b)=> n.position.distanceTo(a.position)-n.position.distanceTo(b.position)).slice(0,5);
      for(const nn of near){
        if(n.position.distanceTo(nn.position) < radius*0.8 && !n.isConnectedTo(nn)) n.addConnection(nn, 0.6);
      }
    }
  }
  return { nodes, root };
}

let nodesMesh=null, connectionsMesh=null, fillerMesh=null, sparkleMesh=null;

function bakePhrase(text){
  const cvs = document.createElement("canvas");
  cvs.width = 1600; cvs.height = 800;
  const g = cvs.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "#fff"; g.strokeStyle = "#fff";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineCap = "round";
  let fs = 260;
  const len = text.length;
  if(len > 8) fs = 215;
  if(len > 14) fs = 178;
  if(len > 22) fs = 145;
  if(len > 32) fs = 118;
  g.font = "900 " + fs + "px Cormorant Garamond, Arial Black, -apple-system, Segoe UI, Arial, sans-serif";
  const maxW = cvs.width - 300;
  const words = text.split(/\s+/);
  const lines = [];
  let line = "";
  for(const w of words){
    const test = line ? line+" "+w : w;
    if(g.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  const lh = fs * 1.15;
  const totalH = lines.length * lh;
  const startY = cvs.height/2 - totalH/2 + lh/2;
  g.lineWidth = Math.max(4, fs*0.04);
  lines.forEach((l,i) => {
    const y = startY + i*lh;
    g.strokeText(l, cvs.width/2, y);
    g.fillText(l, cvs.width/2, y);
  });
  const data = g.getImageData(0,0,cvs.width,cvs.height).data;
  const pts = [];
  const step = 3;
  for(let y=0;y<cvs.height;y+=step){
    for(let x=0;x<cvs.width;x+=step){
      const i = (y*cvs.width + x)*4;
      if(data[i+3] > 60) pts.push({x,y});
    }
  }
  if(!pts.length) pts.push({x:cvs.width/2, y:cvs.height/2});
  let minX=cvs.width, maxX=0, minY=cvs.height, maxY=0;
  pts.forEach(p => {
    if(p.x<minX) minX=p.x; if(p.x>maxX) maxX=p.x;
    if(p.y<minY) minY=p.y; if(p.y>maxY) maxY=p.y;
  });
  const pad = 8;
  minX = Math.max(0, minX-pad); maxX = Math.min(cvs.width, maxX+pad);
  minY = Math.max(0, minY-pad); maxY = Math.min(cvs.height, maxY+pad);
  const cxPx = (minX+maxX)/2;
  const cyPx = (minY+maxY)/2;
  const tW = Math.max(1, maxX-minX);
  const tH = Math.max(1, maxY-minY);
  const aspect = tW/tH;
  const maxW2 = 24, maxH2 = 12;
  let WORLD_W, WORLD_H;
  if(aspect > maxW2/maxH2){ WORLD_W = maxW2; WORLD_H = maxW2/aspect; }
  else { WORLD_H = maxH2; WORLD_W = maxH2*aspect; }
  phraseBounds.w = WORLD_W;
  phraseBounds.h = WORLD_H;
  for(let i=pts.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = pts[i]; pts[i]=pts[j]; pts[j]=t; }
  return pts.map(p => ({ x: ((p.x - cxPx)/tW) * WORLD_W, y: -((p.y - cyPx)/tH) * WORLD_H, z: 0 }));
}

function buildFillerParticles(){
  const count = isPremium ? 25000 : 10000;
  const positions = new Float32Array(count*3);
  const targets = new Float32Array(count*3);
  const colors = new Float32Array(count*3);
  const randoms = new Float32Array(count*3);
  const actives = new Float32Array(count);
  for(let i=0;i<count;i++){
    const r = 6 + Math.random()*22;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    positions[i*3] = r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta) + 2;
    positions[i*3+2] = r*Math.cos(phi);
    targets[i*3] = positions[i*3]; targets[i*3+1] = positions[i*3+1]; targets[i*3+2] = positions[i*3+2];
    const c = palColors[Math.floor(Math.random()*palColors.length)];
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
    randoms[i*3] = Math.random(); randoms[i*3+1] = Math.random(); randoms[i*3+2] = Math.random();
    actives[i] = 1.0;
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute("targetPosition", new THREE.Float32BufferAttribute(targets, 3));
  geom.setAttribute("aColor", new THREE.Float32BufferAttribute(colors, 3));
  geom.setAttribute("aRand", new THREE.Float32BufferAttribute(randoms, 3));
  geom.setAttribute("aActive", new THREE.Float32BufferAttribute(actives, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uMorph: { value: 0 } },
    vertexShader: FILLER_VS, fragmentShader: FILLER_FS,
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.NormalBlending
  });
  fillerMesh = new THREE.Points(geom, mat);
  scene.add(fillerMesh);
}

function buildSparkles(){

  const aPositions = new Float32Array(count*3);
  const colors = new Float32Array(count*3);
  const randoms = new Float32Array(count*3);

    positions[i*3] = (Math.random()-0.5)*100;
    positions[i*3+1] = (Math.random()-0.5)*100;
    positions[i*3+2] = (Math.random()-0.5)*100;
    aPositions[i*3] = (Math.random()-0.5)*40;
    aPositions[i*3+1] = (Math.random()-0.5)*25;
    aPositions[i*3+2] = (Math.random()-0.5)*8;
    const c = palColors[Math.floor(Math.random()*palColors.length)].clone();
    c.lerp(new THREE.Color(1,1,1), Math.random()*0.4);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
    randoms[i*3] = Math.random(); randoms[i*3+1] = Math.random(); randoms[i*3+2] = Math.random();
    const r = Math.random();
    sizes[i] = r < 0.85 ? (0.6 + Math.random()*0.9) : (1.6 + Math.random()*1.4);
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uMorph: { value: 0 } },

  });

  scene.add(sparkleMesh);

function buildVisualization(){
  if(nodesMesh){ scene.remove(nodesMesh); nodesMesh.geometry.dispose(); nodesMesh.material.dispose(); }
  if(connectionsMesh){ scene.remove(connectionsMesh); connectionsMesh.geometry.dispose(); connectionsMesh.material.dispose(); }
  if(fillerMesh){ scene.remove(fillerMesh); fillerMesh.geometry.dispose(); fillerMesh.material.dispose(); }
  if(sparkleMesh){ scene.remove(sparkleMesh); sparkleMesh.geometry.dispose(); sparkleMesh.material.dispose(); }
  const { nodes } = generateNetwork(1.0);
  const nPos=[], nTypes=[], nSizes=[], nColors=[], nDist=[], nTarget=[];
  nodes.forEach((n) => {
    nPos.push(n.position.x, n.position.y, n.position.z);
    nTypes.push(n.type); nSizes.push(n.size); nDist.push(n.distanceFromRoot);
    const ci = Math.min(n.level, palColors.length-1);
    const c = palColors[ci].clone();
    c.offsetHSL(THREE.MathUtils.randFloatSpread(0.03), THREE.MathUtils.randFloatSpread(0.08), THREE.MathUtils.randFloatSpread(0.08));
    nColors.push(c.r, c.g, c.b);
    nTarget.push(n.position.x, n.position.y, n.position.z);
  });
  const nodeGeom = new THREE.BufferGeometry();
  nodeGeom.setAttribute("position", new THREE.Float32BufferAttribute(nPos, 3));
  nodeGeom.setAttribute("nodeType", new THREE.Float32BufferAttribute(nTypes, 1));
  nodeGeom.setAttribute("nodeSize", new THREE.Float32BufferAttribute(nSizes, 1));
  nodeGeom.setAttribute("nodeColor", new THREE.Float32BufferAttribute(nColors, 3));
  nodeGeom.setAttribute("distanceFromRoot", new THREE.Float32BufferAttribute(nDist, 1));
  nodeGeom.setAttribute("targetPosition", new THREE.Float32BufferAttribute(nTarget, 3));
  nodesMesh = new THREE.Points(nodeGeom, new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(pulseUniforms),
    vertexShader: NODE_VS, fragmentShader: NODE_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  scene.add(nodesMesh);
  const cPos=[], cCol=[], cStr=[], cStart=[], cEnd=[], cPath=[];
  const processed = new Set();
  let pid = 0;
  nodes.forEach((n, ni) => {
    n.connections.forEach(c => {
      const ci = nodes.indexOf(c.node);
      if(ci === -1) return;
      const key = [Math.min(ni,ci), Math.max(ni,ci)].join("-");
      if(processed.has(key)) return;
      processed.add(key);
      for(let i=0;i<20;i++){
        const t = i/19;
        cPos.push(t,0,0);
        cStart.push(n.position.x, n.position.y, n.position.z);
        cEnd.push(c.node.position.x, c.node.position.y, c.node.position.z);
        cPath.push(pid); cStr.push(c.strength);
        const avgLvl = Math.min(Math.floor((n.level + c.node.level)/2), palColors.length-1);
        const cc = palColors[avgLvl].clone();
        cc.offsetHSL(THREE.MathUtils.randFloatSpread(0.03), THREE.MathUtils.randFloatSpread(0.08), THREE.MathUtils.randFloatSpread(0.08));
        cCol.push(cc.r, cc.g, cc.b);
      }
      pid++;
    });
  });
  const connGeom = new THREE.BufferGeometry();
  connGeom.setAttribute("position", new THREE.Float32BufferAttribute(cPos, 3));
  connGeom.setAttribute("startPoint", new THREE.Float32BufferAttribute(cStart, 3));
  connGeom.setAttribute("endPoint", new THREE.Float32BufferAttribute(cEnd, 3));
  connGeom.setAttribute("connectionStrength", new THREE.Float32BufferAttribute(cStr, 1));
  connGeom.setAttribute("connectionColor", new THREE.Float32BufferAttribute(cCol, 3));
  connGeom.setAttribute("pathIndex", new THREE.Float32BufferAttribute(cPath, 1));
  connectionsMesh = new THREE.LineSegments(connGeom, new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(pulseUniforms),
    vertexShader: CONN_VS, fragmentShader: CONN_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  scene.add(connectionsMesh);
  palColors.slice(0,3).forEach((color, i) => {
    nodesMesh.material.uniforms.uPulseColors.value[i].copy(color);
    connectionsMesh.material.uniforms.uPulseColors.value[i].copy(color);
  });
  buildFillerParticles();
  buildSparkles();
  updatePhraseTargets(CONFIG.phrases[0]);
}

function updatePhraseTargets(phrase){
  const pts = bakePhrase(phrase);
  const total = pts.length;
  if(!total) return;
  if(nodesMesh){
    const a = nodesMesh.geometry.attributes.targetPosition;
    const arr = a.array;
    for(let i=0;i<a.count;i++){
      const p = pts[i%total];
      arr[i*3] = p.x + (Math.random()-0.5)*0.05;
      arr[i*3+1] = p.y + (Math.random()-0.5)*0.05;
      arr[i*3+2] = (Math.random()-0.5)*0.12;
    }
    a.needsUpdate = true;
  }
  if(fillerMesh){
    const a = fillerMesh.geometry.attributes.targetPosition;
    const act = fillerMesh.geometry.attributes.aActive;
    const arr = a.array, actArr = act.array;
    const toP = Math.min(9000, Math.floor(a.count * 0.40));
    for(let i=0;i<a.count;i++){
      if(i < toP){
        const p = pts[i%total];
        arr[i*3] = p.x + (Math.random()-0.5)*0.05;
        arr[i*3+1] = p.y + (Math.random()-0.5)*0.05;
        arr[i*3+2] = (Math.random()-0.5)*0.12;
        actArr[i] = 1.0;
      } else {
        arr[i*3] = (Math.random()-0.5)*100;
        arr[i*3+1] = (Math.random()-0.5)*100;
        arr[i*3+2] = (Math.random()-0.5)*60;
        actArr[i] = 0.0;
      }
    }
    a.needsUpdate = true; act.needsUpdate = true;
  }
  if(sparkleMesh){
    const a = sparkleMesh.geometry.attributes.aPos;
    const arr = a.array;
    for(let i=0;i<a.count;i++){
      arr[i*3] = (Math.random()-0.5) * (phraseBounds.w * 2);
      arr[i*3+1] = (Math.random()-0.5) * (phraseBounds.h * 2);
      arr[i*3+2] = (Math.random()-0.5)*6;
    }
    a.needsUpdate = true;
  }
}

let phraseIdx = 0;
let morphValue = 0;
let morphStart = 0;
let currentState = "network";
let started = false;
const frontCamPos = new THREE.Vector3(0, 0, 40);
const originTarget = new THREE.Vector3(0, 0, 0);
const clock = new THREE.Clock();

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const interactionPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
const interactionPoint = new THREE.Vector3();
let lastPulseIdx = 0;

function triggerPulse(cx, cy){
  pointer.x = (cx / window.innerWidth) * 2 - 1;
  pointer.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  interactionPlane.normal.copy(camera.position).normalize();
  interactionPlane.constant = -interactionPlane.normal.dot(camera.position) + camera.position.length()*0.5;
  if(raycaster.ray.intersectPlane(interactionPlane, interactionPoint)){
    const t = clock.getElapsedTime();
    if(nodesMesh && connectionsMesh){
      lastPulseIdx = (lastPulseIdx + 1) % 3;
      nodesMesh.material.uniforms.uPulsePositions.value[lastPulseIdx].copy(interactionPoint);
      nodesMesh.material.uniforms.uPulseTimes.value[lastPulseIdx] = t;
      connectionsMesh.material.uniforms.uPulsePositions.value[lastPulseIdx].copy(interactionPoint);
      connectionsMesh.material.uniforms.uPulseTimes.value[lastPulseIdx] = t;
      const rc = palColors[Math.floor(Math.random()*palColors.length)];
      nodesMesh.material.uniforms.uPulseColors.value[lastPulseIdx].copy(rc);
      connectionsMesh.material.uniforms.uPulseColors.value[lastPulseIdx].copy(rc);
    }
  }
}

function computeNeededDistance(){
  const fovRad = camera.fov * Math.PI / 180;
  const aspect = Math.max(0.35, camera.aspect);
  const viewH = 2 * Math.tan(fovRad / 2);
  const dH = (phraseBounds.h * 1.25) / viewH;
  const dW = (phraseBounds.w * 1.25) / (viewH * aspect);
  return Math.max(dH, dW);
}

const magicBtn = document.getElementById("magic-btn");

function triggerPhrase(){
  if(currentState !== "network") return;

  // Detenerse cuando ya se mostraron todas las frases
  if(phraseIdx >= CONFIG.phrases.length) return;

  currentState = "toPhrase";
  morphStart = clock.getElapsedTime();

  // Mostrar la siguiente frase en orden
  updatePhraseTargets(CONFIG.phrases[phraseIdx]);
  phraseIdx++;

  const needed = computeNeededDistance();
  frontCamPos.set(0, 0, needed * 1.05);

  controls.autoRotate = false;
  magicBtn.classList.add("active");
  magicBtn.querySelector(".mb-text").textContent = "Volver a la galaxia";
  magicBtn.querySelector(".mb-icon").textContent = "🌻";
}


function releasePhrase(){
  if(currentState !== "phrase" && currentState !== "toPhrase") return;

  currentState = "toNetwork";
  morphStart = clock.getElapsedTime();
  controls.autoRotate = true;
  magicBtn.classList.remove("active");
  magicBtn.querySelector(".mb-text").textContent = "Haz click aquí y haz magia";
  magicBtn.querySelector(".mb-icon").textContent = "🪄";
}

magicBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if(currentState === "network") triggerPhrase();
  else releasePhrase();
});

function handleTap(cx, cy){
  if(!started) return;
  if(currentState === "phrase" || currentState === "toPhrase") triggerPulse(cx, cy);
}
window.addEventListener("click", (e) => {
  if(!started) return;
  if(e.target.closest("#music-btn") || e.target.closest("#music-panel") ||
     e.target.closest(".controls") || e.target.closest(".watermark") ||
     e.target.closest("#magic-btn") || e.target.closest("#premium-modal") ||
     e.target.closest("#intro-overlay")) return;
  handleTap(e.clientX, e.clientY);
});
window.addEventListener("touchstart", (e) => {
  if(!started) return;
  const t = e.touches[0]; if(!t) return;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if(el && (el.closest("#music-btn") || el.closest("#music-panel") || el.closest(".controls") ||
            el.closest(".watermark") || el.closest("#magic-btn") || el.closest("#premium-modal") ||
            el.closest("#intro-overlay"))) return;
  handleTap(t.clientX, t.clientY);
}, { passive: true });

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.resolution.set(window.innerWidth, window.innerHeight);
});

const introOverlay = document.getElementById("intro-overlay");
const introBtn = document.getElementById("intro-btn");
let zoomStartTime = 0;
let zoomDone = false;
introBtn.addEventListener("click", () => {
  if(started) return;
  started = true;
  introOverlay.classList.add("zooming");
  setTimeout(() => { introOverlay.classList.add("hidden"); magicBtn.classList.add("shown"); }, 1400);
  audio.play().then(() => { mpPlay.textContent = "⏸︎"; musicBtn.classList.add("playing"); musicBtn.textContent = "🎶"; }).catch(() => {});
});

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if(started && !zoomDone){
    if(zoomStartTime === 0) zoomStartTime = t;
    const p = Math.min(1, (t - zoomStartTime) / 2.4);
    const e = 1 - Math.pow(1 - p, 3);
    camera.position.z = THREE.MathUtils.lerp(140, 28, e);
    camera.position.y = THREE.MathUtils.lerp(10, 8, e);
    if(p >= 1){ zoomDone = true; }
  }
  if(currentState === "toPhrase" || currentState === "toNetwork"){
    const p = Math.min(1, (t - morphStart) / 1.6);
    const e = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;
    morphValue = currentState === "toPhrase" ? e : 1 - e;
    if(p >= 1){
      if(currentState === "toPhrase") currentState = "phrase";
      else { currentState = "network"; morphValue = 0; }
    }
  }
  if(currentState === "toPhrase"){
    camera.position.lerp(frontCamPos, 0.08);
    controls.target.lerp(originTarget, 0.12);
  }
  const targetBloom = BASE_BLOOM + (PHRASE_BLOOM - BASE_BLOOM) * morphValue;
  bloomPass.strength += (targetBloom - bloomPass.strength) * 0.08;
  if(nodesMesh){
    nodesMesh.material.uniforms.uTime.value = t;
    nodesMesh.material.uniforms.uMorph.value = morphValue;
    nodesMesh.rotation.y = Math.sin(t*0.04)*0.05*(1-morphValue);
  }
  if(connectionsMesh){
    connectionsMesh.material.uniforms.uTime.value = t;
    connectionsMesh.material.uniforms.uMorph.value = morphValue;
    connectionsMesh.rotation.y = Math.sin(t*0.04)*0.05*(1-morphValue);
  }
  if(fillerMesh){
    fillerMesh.material.uniforms.uTime.value = t;
    fillerMesh.material.uniforms.uMorph.value = morphValue;
    fillerMesh.rotation.y = Math.sin(t*0.04)*0.05*(1-morphValue);
  }
  if(sparkleMesh){
    sparkleMesh.material.uniforms.uTime.value = t;
    sparkleMesh.material.uniforms.uMorph.value = morphValue;
    sparkleMesh.rotation.y = Math.sin(t*0.04)*0.05*(1-morphValue);
  }
  sunflowerGroup.children.forEach(s => {
    s.position.y = s.userData.baseY + Math.sin(t * s.userData.speed + s.userData.phase) * 1.2;
  });
  sunflowerGroup.rotation.y += 0.0008;
  starField.rotation.y += 0.0002;
  starField.material.uniforms.uTime.value = t;
  controls.update();
  composer.render();
}

buildVisualization();
animate();
</script>
