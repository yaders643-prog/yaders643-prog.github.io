<script>
// ================= CONFIGURACIÓN AUDIO =================
const audio = document.getElementById('audio');
const pantallaInicial = document.getElementById('pantalla-inicial');

let isPlaying = false;

pantallaInicial.addEventListener('click', async () => {
  try {
    await audio.play();
    isPlaying = true;

    pantallaInicial.classList.add('ocultar');

    setTimeout(() => {
      pantallaInicial.remove();
    }, 1000);

  } catch (error) {
    console.log('No se pudo reproducir el audio:', error);
  }
}, { once: true });


// ================= ESCENA 3D =================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  5000
);

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));


// ================= TEXTURA DE ESTRELLAS =================
function createStarTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;

    const ctx = canvas.getContext('2d');

    const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);

    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.1, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.4, 'rgba(255, 230, 255, 0.7)');
    gradient.addColorStop(0.7, 'rgba(255, 182, 193, 0.2)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 128, 128);

    return new THREE.CanvasTexture(canvas);
}


// ================= FONDO DE ESTRELLAS =================
const starTexture = createStarTexture();
const starGeometry = new THREE.BufferGeometry();
const starPos = [];
const starCount = 25000;

for(let i = 0; i < starCount; i++) {
    starPos.push(
      (Math.random() - 0.5) * 4000,
      (Math.random() - 0.5) * 4000,
      (Math.random() - 0.5) * 4000
    );
}

starGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(starPos, 3)
);

const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 12,
    map: starTexture,
    transparent: true,
    opacity: 1.0,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);


// ================= TEXTURA REALISTA DE SATURNO =================
function createSaturnTexture() {
    const c = document.createElement('canvas');
    c.width = 1024;
    c.height = 512;

    const ctx = c.getContext('2d');

    const colors = [
        [0.00, '#bca783'],
        [0.10, '#e2d5b8'],
        [0.18, '#c5ad86'],
        [0.25, '#e8ddc5'],
        [0.33, '#b69b73'],
        [0.40, '#d9c7a3'],
        [0.48, '#eee2c8'],
        [0.55, '#c5ad87'],
        [0.63, '#e5d7b8'],
        [0.70, '#b89d76'],
        [0.78, '#e4d7bb'],
        [0.88, '#c5ad88'],
        [1.00, '#a9906d']
    ];

    for (let y = 0; y < 512; y++) {
        const t = y / 512;

        let index = 0;

        while (
          index < colors.length - 2 &&
          t > colors[index + 1][0]
        ) {
            index++;
        }

        const start = colors[index];
        const end = colors[index + 1];

        const factor = (t - start[0]) / (end[0] - start[0]);

        const a = new THREE.Color(start[1]);
        const b = new THREE.Color(end[1]);

        const color = a.lerp(b, factor);

        const wave =
            Math.sin(y * 0.12) * 0.025 +
            Math.sin(y * 0.045) * 0.018;

        color.r += wave;
        color.g += wave;
        color.b += wave * 0.7;

        ctx.fillStyle = `#${color.getHexString()}`;
        ctx.fillRect(0, y, 1024, 1);
    }

    // Bandas atmosféricas sutiles
    for (let i = 0; i < 90; i++) {
        const y = Math.random() * 512;
        const alpha = Math.random() * 0.09;

        ctx.fillStyle = `rgba(110, 91, 65, ${alpha})`;
        ctx.fillRect(0, y, 1024, Math.random() * 3 + 1);
    }

    return new THREE.CanvasTexture(c);
}


// ================= PLANETA SATURNO =================
const planetGeom = new THREE.SphereGeometry(50, 96, 96);

const planetMat = new THREE.MeshPhongMaterial({
    map: createSaturnTexture(),
    shininess: 5,
    specular: new THREE.Color('#75664e')
});

const saturn = new THREE.Mesh(planetGeom, planetMat);

saturn.rotation.z = 0.4;

scene.add(saturn);


// ================= TEXTURA DE LOS ANILLOS =================
function createRingTexture() {
    const c = document.createElement('canvas');
    c.width = 1024;
    c.height = 128;

    const ctx = c.getContext('2d');

    const ringColors = [
        '#8f8068',
        '#d1c2a3',
        '#a99a7d',
        '#e1d5bc',
        '#b6a789',
        '#e8dfca',
        '#97876b'
    ];

    for (let x = 0; x < 1024; x++) {
        const t = x / 1024;

        // División de Cassini
        if (t > 0.63 && t < 0.69) {
            ctx.fillStyle = 'rgba(5,5,5,0.95)';
        } else {
            const band = Math.floor(
                (t * 45 + Math.sin(t * 180) * 1.5)
            ) % ringColors.length;

            ctx.fillStyle = ringColors[band];

            if (Math.random() > 0.7) {
                ctx.globalAlpha = 0.65;
            } else {
                ctx.globalAlpha = 1;
            }
        }

        ctx.fillRect(x, 0, 1, 128);
    }

    ctx.globalAlpha = 1;

    return new THREE.CanvasTexture(c);
}


// ================= ANILLOS =================
const ringGeom = new THREE.RingGeometry(65, 125, 128);

const pos = ringGeom.attributes.position;
const v3 = new THREE.Vector3();

for (let i = 0; i < pos.count; i++) {
    v3.fromBufferAttribute(pos, i);

    ringGeom.attributes.uv.setXY(
      i,
      (v3.length() - 65) / (125 - 65),
      0
    );
}

const ringMat = new THREE.MeshBasicMaterial({
    map: createRingTexture(),
    transparent: true,
    side: THREE.DoubleSide,
    opacity: 0.85
});

const rings = new THREE.Mesh(ringGeom, ringMat);

rings.rotation.x = Math.PI / 2;

saturn.add(rings);


// ================= ILUMINACIÓN =================
const sunLight = new THREE.DirectionalLight(0xfff1d6, 2);

sunLight.position.set(150, 100, 150);

scene.add(sunLight);

scene.add(new THREE.AmbientLight(0xc4b69b, 0.65));


// ================= LISTA DE PALABRAS =================
const words = [
    'Mi princesa 👑', 'Hermosa 🌹', 'Mi niña 🎀', 'Dulzura 🍯', 'Mi flor 🌷',
    'Preciosa 💗', 'Mi reina 💍', 'Bonita 🦋', 'Mi cielo ☁️', 'Mi sol ☀️',
    'Encanto ✨', 'Mi amor ❤️', 'Bella 🌸', 'Mi vida 💕', 'Mi luz 🌟',
    'Ternura 🧸', 'Mi musa 🎨', 'Divina 💐', 'Mi estrella ⭐', 'Mi paz 🕊️',
    'Gleysis 💖', 'Mi joya 💎', 'Dulce 🍓', 'Mi luna 🌙', 'Mi ángel 😇',
    'Soñadora 🌠', 'Mi rosa 🌹', 'Mi cielo 💫', 'Alegría 🌻', 'Mi solcito 🌞',
    'Mi encanto 🥰', 'Linda 💞', 'Mi bella 🌺', 'Mi tesoro 💍', 'Mi hada 🧚',
    'Amorcito 💓', 'Mi perla 🦪', 'Princesita 👸', 'Mi mariposa 🦋', 'Bonbon 🍬',
    'Mi pasión 🔥', 'Mi sonrisa 😊', 'Mi poema 📖', 'Mi melodía 🎶', 'Mi magia 🪄',
    'Mi ilusión 💭', 'Mi primavera 🌼', 'Mi sueño 💗', 'Mi bombón 🍫', 'Mi cielo 🌌',
    'Gleysis 🌷', 'Gleysis ❤️', 'Gleysis 💐', 'Gleysis ✨', 'Gleysis 🦋',
    'Mi favorita 💕', 'Mi dulzura 🌸', 'Mi bonita 🎀', 'Mi encanto 🌹', 'Mi razón 💘',
    'Mi refugio 🏡', 'Mi universo 🪐', 'Mi lucero 🌟', 'Mi caramelo 🍭', 'Mi ternura 🤍',
    'Mi muñeca 🎀', 'Mi sirena 🧜‍♀️', 'Mi chiquita 💝', 'Mi belleza 🌺', 'Mi adorable 💗',
    'Mi corazón 💓', 'Mi cielo azul 💙', 'Mi angelita 😇', 'Mi florcita 🌻', 'Mi estrella 🌠',
    'Única 💎', 'Especial 🌷', 'Inolvidable 💫', 'Radiante ☀️', 'Perfecta 💖',
    'Mi encanto 💞', 'Mi princesa 🌹', 'Mi adoración 🥰', 'Mi alegría 💐', 'Mi eternidad ♾️',
    'Mi debilidad 💘', 'Mi destino 💍', 'Mi persona favorita 🫶', 'Mi inspiración 🌸', 'Mi felicidad ❤️'
];


function makeTextSprite(message) {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 128;

    const ctx = c.getContext('2d');

    ctx.font = 'Bold 46px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = 'white';

    ctx.shadowColor = '#ff69b4';
    ctx.shadowBlur = 18;

    ctx.fillText(message, 256, 64);

    const tex = new THREE.CanvasTexture(c);

    const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true
    });

    return new THREE.Sprite(mat);
}


// ================= PALABRAS ORBITANDO =================
const wordGroup = new THREE.Group();

scene.add(wordGroup);

words.forEach((w, i) => {
    const sprite = makeTextSprite(w);

    const isMobile = window.innerWidth < 600;

    const scale = isMobile ? 68 : 58;

    sprite.scale.set(scale, scale / 4, 1);

    const angle = (i / words.length) * Math.PI * 2;

    const radius = (isMobile ? 140 : 170) + Math.random() * 120;

    const height = (Math.random() - 0.5) * 180;

    sprite.userData = {
        angle,
        radius,
        height,
        speed: 0.0005 + Math.random() * 0.0012
    };

    wordGroup.add(sprite);
});


// ================= INTERACCIÓN =================
let rotY = 0;
let rotX = 0;

let targetDist = window.innerWidth < 600 ? 400 : 360;
let curDist = targetDist;

let isDragging = false;
let lastX, lastY;

const onPointerDown = (x, y) => {
    isDragging = true;
    lastX = x;
    lastY = y;
};

const onPointerMove = (x, y) => {
    if (!isDragging) return;

    rotY += (x - lastX) * 0.005;

    rotX = Math.max(
        -Math.PI / 3,
        Math.min(
            Math.PI / 3,
            rotX + (y - lastY) * 0.005
        )
    );

    lastX = x;
    lastY = y;
};

window.addEventListener('mousedown', e => {
    onPointerDown(e.clientX, e.clientY);
});

window.addEventListener('mousemove', e => {
    onPointerMove(e.clientX, e.clientY);
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

window.addEventListener('touchstart', e => {
    onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
});

window.addEventListener('touchmove', e => {
    onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
});

window.addEventListener('touchend', () => {
    isDragging = false;
});

window.addEventListener('wheel', e => {
    targetDist = Math.max(
        180,
        Math.min(1000, targetDist + e.deltaY * 0.5)
    );
}, { passive: true });


// ================= ANIMACIÓN =================
function animate() {
    requestAnimationFrame(animate);

    const time = Date.now() * 0.001;

    saturn.rotation.y += 0.004;

    stars.rotation.y += 0.0008;
    stars.rotation.x += 0.0004;

    stars.position.z = Math.sin(time * 0.1) * 50;

    starMaterial.opacity = 0.85 + Math.sin(time * 2.5) * 0.15;

    wordGroup.children.forEach(sprite => {
        sprite.userData.angle += sprite.userData.speed;

        sprite.position.x =
            Math.cos(sprite.userData.angle) * sprite.userData.radius;

        sprite.position.z =
            Math.sin(sprite.userData.angle) * sprite.userData.radius;

        sprite.position.y =
            sprite.userData.height +
            Math.sin(time * 0.6 + sprite.userData.angle) * 20;
    });

    curDist += (targetDist - curDist) * 0.08;

    camera.position.x =
        curDist * Math.sin(rotY) * Math.cos(rotX);

    camera.position.z =
        curDist * Math.cos(rotY) * Math.cos(rotX);

    camera.position.y =
        curDist * Math.sin(rotX);

    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
}


// ================= AJUSTE DE PANTALLA =================
window.addEventListener('resize', () => {
    const width = window.innerWidth;
    const height = window.innerHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

    targetDist = width < 600 ? 400 : 360;
});

animate();

</script>
